if (parent == null) subprojects {
    pluginManager.withPlugin(convention.plugins.android.get().pluginId) {
        kotlin {
            compilerOptions {
                afterEvaluate {
                    if (!findProperty('isKotlinOnly')) freeCompilerArgs.addAll [
                            '-Xno-call-assertions',
                            '-Xno-param-assertions',
                            '-Xno-receiver-assertions',
                    ]
                }
            }
            explicitApi()
        }

        java.toolchain.languageVersion.set JavaLanguageVersion.of(11)

        android.lint.informational 'GradleDependency'

        dependencies {
            testImplementation libs.bundles.testing
        }
    }
}
