[versions]
android = "9.1.0"
compose-compiler = "1.5.15"
kotlin = "2.3.20"
screenshot = "0.0.1-alpha14"

[plugins]
android = { id = "com.android.library", version.ref = "android" }
android-app = { id = "com.android.application", version.ref = "android" }
android-kapt = { id = "com.android.legacy-kapt", version.ref = "android" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }

[libraries]
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.7.1"
androidx-compose-bom = "androidx.compose:compose-bom:2026.03.01"
androidx-compose-material.module = "androidx.compose.material:material"
androidx-compose-ui.module = "androidx.compose.ui:ui"
androidx-compose-ui-preview.module = "androidx.compose.ui:ui-tooling-preview"
androidx-compose-ui-test.module = "androidx.compose.ui:ui-test-junit4"
androidx-compose-ui-tooling.module = "androidx.compose.ui:ui-tooling"
androidx-core = "androidx.core:core:1.18.0"
androidx-core-ktx = "androidx.core:core-ktx:1.18.0"
androidx-databinding-common = { module = "androidx.databinding:databinding-common", version.ref = "android" }
androidx-fragment = "androidx.fragment:fragment:1.8.9"
androidx-test-core = "androidx.test:core:1.7.0"
androidx-test-espresso = "androidx.test.espresso:espresso-core:3.7.0"
androidx-test-junit = "androidx.test.ext:junit:1.3.0"
androidx-test-runner = "androidx.test:runner:1.7.0"
google-material = "com.google.android.material:material:1.13.0"
junit = "junit:junit:4.13.2"
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin-test.module = "org.jetbrains.kotlin:kotlin-test-junit"
mockk = "io.mockk:mockk:1.14.9"
robolectric = "org.robolectric:robolectric:4.16.1"
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot" }
slf4j = "org.slf4j:slf4j-nop:2.0.17"

[bundles]
testing = ["kotlin-test", "junit", "mockk", "slf4j"]
testing-android = ["androidx-test-runner", "androidx-test-espresso", "androidx-test-junit", "junit"]
